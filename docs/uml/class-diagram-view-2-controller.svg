<text x="508.0" y="-21.0" font-size="12"><tspan font-weight="bold">Composition</tspan></text>
<text x="508.0" y="-6.0" font-size="12">GameController creates its tables, queue, staff,</text>
<text x="508.0" y="9.0" font-size="12">Happy Hour and scoreboard itself, and they only</text>
<text x="508.0" y="24.0" font-size="12">exist as part of one game (filled diamond).</text>
<text x="508.0" y="39.0" font-size="12">Customers come in from GameSetup and exist on</text>
<text x="508.0" y="54.0" font-size="12">their own (hollow diamond).</text>
