<path d="M-10.0,400.0 H278.0 L288.0,410.0 V504.0 H-10.0 Z" fill="white" stroke="black" stroke-width="1"/>
<path d="M278.0,400.0 V410.0 H288.0" fill="none" stroke="black" stroke-width="1"/>
<text x="-2.0" y="419.0" font-size="12"><tspan font-weight="bold">Encapsulation</tspan></text>
<text x="-2.0" y="434.0" font-size="12">Every attribute is private. A customer&#x27;s status only</text>
<text x="-2.0" y="449.0" font-size="12">changes through its own methods, which refuse a step</text>
<text x="-2.0" y="464.0" font-size="12">out of order: pay() before READY_TO_PAY, or leave()</text>
<text x="-2.0" y="479.0" font-size="12">when not waiting. Order works the same way</text>
<text x="-2.0" y="494.0" font-size="12">(markServed() needs READY, markPaid() needs SERVED).</text>
<path d="M700.0,900.0 H954.0 L964.0,910.0 V1019.0 H700.0 Z" fill="white" stroke="black" stroke-width="1"/>
<path d="M954.0,900.0 V910.0 H964.0" fill="none" stroke="black" stroke-width="1"/>
<text x="708.0" y="919.0" font-size="12"><tspan font-weight="bold">Polymorphism</tspan> (stage 2)</text>
<text x="708.0" y="934.0" font-size="12">GameController only calls Customer methods.</text>
<text x="708.0" y="949.0" font-size="12">getSatisfactionLoss(): Regular 8, VIP 5, Critic 12</text>
<text x="708.0" y="964.0" font-size="12">calculateBill(): VIP 10% off</text>
<text x="708.0" y="979.0" font-size="12">chooseMenuItem(): the Critic picks the item with</text>
<text x="708.0" y="994.0" font-size="12">the most preparation units</text>
<text x="708.0" y="1009.0" font-size="12">No instanceof or type checks anywhere.</text>
